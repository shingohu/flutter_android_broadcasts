name: flutter_android_broadcasts
description: android broadcast plugin for flutter.
version: 0.0.1
homepage: https://github.com/shingohu/flutter_android_broadcasts

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter


flutter:
  plugin:
    platforms:
      android:
        package: de.shingo.flutter_broadcasts
        pluginClass: FlutterBroadcastsPlugin
